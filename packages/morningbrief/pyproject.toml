[project]
name = "morningbrief"
version = "0.1.0"
description = "Local morning brief orchestrator (briefctl)"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "jsonschema>=4.22",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
briefctl = "morningbrief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morningbrief"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
